# Helios: конфигурация для s504568. Пути модулей взяты из выданного шаблона.
# Запуск: /usr/local/sbin/httpd -f "$HOME/lab2/config/httpd.conf" -k start
ServerRoot "/usr/local"
Listen 24000
ServerName localhost:24000
AcceptFilter http none
PidFile "/home/studs/s504568/lab2/httpd-root/httpd.pid"
Mutex default:/home/studs/s504568/lab2/httpd-root/mutex-dir/
ErrorLog "/home/studs/s504568/lab2/httpd-root/error.log"
LogLevel warn

LoadModule authz_core_module libexec/apache24/mod_authz_core.so
LoadModule authz_host_module libexec/apache24/mod_authz_host.so
LoadModule unixd_module libexec/apache24/mod_unixd.so
LoadModule mime_module libexec/apache24/mod_mime.so
LoadModule dir_module libexec/apache24/mod_dir.so
LoadModule alias_module libexec/apache24/mod_alias.so
LoadModule log_config_module libexec/apache24/mod_log_config.so
LoadModule reqtimeout_module libexec/apache24/mod_reqtimeout.so
LoadModule fastcgi_module libexec/apache24/mod_fastcgi.so

DocumentRoot "/home/studs/s504568/lab2/public"
DirectoryIndex index.html
TypesConfig etc/apache24/mime.types
AddDefaultCharset UTF-8
AddType text/javascript .js
LogFormat "%h %t \"%r\" %>s %b" common
CustomLog "/home/studs/s504568/lab2/httpd-root/access.log" common
ServerTokens Prod
ServerSignature Off
Timeout 15
RequestReadTimeout header=10-20,MinRate=500 body=10,MinRate=500
# 0 снимает ограничение размера тела: длина десятичной дроби по заданию не ограничена.
LimitRequestBody 0

<Directory />
    AllowOverride None
    Require all denied
</Directory>
<Directory "/home/studs/s504568/lab2/public">
    Options None
    AllowOverride None
    Require all granted
</Directory>

# Без -nph: Java возвращает CGI-заголовок Status, модуль создаёт HTTP-ответ.
FastCgiIpcDir "/home/studs/s504568/lab2/httpd-root/fastcgi"
FastCgiExternalServer "/home/studs/s504568/lab2/build/lab2.jar" -host 127.0.0.1:24001 -idle-timeout 15
Alias /api/check "/home/studs/s504568/lab2/build/lab2.jar"
<Directory "/home/studs/s504568/lab2/build">
    Options None
    AllowOverride None
    Require all granted
</Directory>
<Files ".*">
    Require all denied
</Files>
